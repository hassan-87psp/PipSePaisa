<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" role="img" aria-label="Golden geometric bull and rising market candlesticks">
<defs>
<linearGradient id="body" x1="0" y1="1" x2=".9" y2=".05"><stop offset="0" stop-color="#743004"/><stop offset=".36" stop-color="#ff9c12"/><stop offset=".7" stop-color="#ffcd45"/><stop offset="1" stop-color="#8a4207"/></linearGradient>

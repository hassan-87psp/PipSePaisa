<!doctype html>
<html lang="en" style="visibility:hidden">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>PipSePaisa</title>
<link rel="icon" href="/favicon.png">
<script defer src="/psp-link-tracking-v42.js?v=20261006-v404-instant-short"></script>
</head>
<body>
<script>
(function(){
  'use strict';
  const BASE='https://www.pipsepaisa.com';
  function getSlug(){
    try{
      const q=new URLSearchParams(location.search);
      return String(q.get('s')||q.get('ref')||'').trim().toLowerCase().replace(/[^a-z0-9-]/g,'').slice(0,80);
    }catch(_){return '';}
  }
  function normalizeDestination(raw){
    const s=String(raw||'/').trim()||'/';
    try{
      const u=new URL(s,BASE);
      const route=String(u.searchParams.get('psp_route')||'').replace(/\/+$/,'');
      const routeMap={'/courses':'/courses/','/free-course':'/free-course/','/broker-reviews':'/broker-reviews/','/partner':'/becomepartner/','/become-partner':'/becomepartner/','/trading-tools':'/tradingtools/','/tools-services':'/tradingtools/','/sign-in':'/sign-in/','/sign-up':'/sign-up/','/technical':'/technical/','/fundamental':'/fundamental/'};
      const pathMap={'/courses':'/courses/','/courses.html':'/courses/','/broker-reviews':'/broker-reviews/','/broker-reviews.html':'/broker-reviews/','/become-partner':'/becomepartner/','/partner':'/becomepartner/','/partner.html':'/becomepartner/','/trading-tools':'/tradingtools/','/tools-services.html':'/tradingtools/','/sign-in':'/sign-in/','/sign-up':'/sign-up/','/free-course':'/free-course/','/technical':'/technical/','/fundamental':'/fundamental/'};
      const out=routeMap[route]||pathMap[u.pathname]||u.pathname||'/';
      u.searchParams.delete('psp_route');
      const q=u.searchParams.toString();
      return out+(q?'?'+q:'')+(u.hash||'');
    }catch(_){return '/';}
  }
  async function run(){
    const code=getSlug();
    if(!code){location.replace('/');return;}
    try{
      for(let i=0;i<40&&!window.PSPTrack;i++)await new Promise(r=>setTimeout(r,50));
      if(!window.PSPTrack)throw new Error('tracking-unavailable');
      const result=await window.PSPTrack.record('click',{slug:code,metadata:{short_link:true,entry_path:'/r/'}});
      const row=result&&result.row;
      if(!result?.ok||!row)throw new Error('link-unavailable');
      location.replace(normalizeDestination(row.destination_path||'/'));
    }catch(_){
      location.replace('/');
    }
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run();
})();
</script>
</body>
</html>

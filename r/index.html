<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>PipSePaisa</title>
<link rel="preconnect" href="https://etfolhinohgmskbfjoyh.supabase.co" crossorigin>
<script>
(function(){
  'use strict';
  
  var SUPA='https://etfolhinohgmskbfjoyh.supabase.co';
  var KEY='sb_publishable_LgmfuH2ePiY8fxNGs7nTTA_FSS_oPBw';
  var ATTR='psp_link_attribution_v42', VIS='psp_visitor_id_v42', SES='psp_session_id_v42';
  function id(prefix){try{return prefix+(crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now().toString(36));}catch(_){return prefix+Math.random().toString(36).slice(2)+Date.now().toString(36);}}
  function stored(store,key,prefix){try{var v=store.getItem(key)||'';if(!v){v=id(prefix);store.setItem(key,v);}return v;}catch(_){return id(prefix);}}
  function saveAttr(code,row){
    try{
      var cur={};try{cur=JSON.parse(localStorage.getItem(ATTR)||'{}')||{};}catch(_){}
      var now=new Date().toISOString();
      localStorage.setItem(ATTR,JSON.stringify({
        ...cur,slug:code,link_id:row.link_id||null,name:row.link_name||null,
        destination_path:row.destination_path||null,source:row.source||null,campaign:row.campaign||null,
        entry_path:location.pathname,first_seen_at:cur.first_seen_at||now,last_seen_at:now
      }));
    }catch(_){}
  }
  async function resolveShort(code){
    var body={
      p_slug:code,p_event_type:'click',
      p_visitor_id:stored(localStorage,VIS,'v_'),
      p_session_id:stored(sessionStorage,SES,'s_'),
      p_user_id:null,p_course_key:null,
      p_page_path:location.pathname+location.search,
      p_referrer:document.referrer||null,p_user_agent:navigator.userAgent||null,
      p_metadata:{short_link:true,entry_path:location.pathname}
    };
    var res=await fetch(SUPA+'/rest/v1/rpc/psp_record_tracked_link_event',{
      method:'POST',mode:'cors',cache:'no-store',
      headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY,'Accept':'application/json'},
      body:JSON.stringify(body)
    });
    if(!res.ok)throw new Error('resolve-failed');
    var data=await res.json();
    var row=Array.isArray(data)?data[0]:data;
    if(!row||!row.destination_path)throw new Error('link-unavailable');
    saveAttr(code,row);
    return row.destination_path;
  }
  function normalizeDestination(raw){
    var BASE='https://www.pipsepaisa.com',s=String(raw||'/').trim()||'/';
    try{
      var u=new URL(s,BASE),route=String(u.searchParams.get('psp_route')||'').replace(/\/+$/,'');
      var routeMap={'/courses':'/courses/','/free-course':'/free-course/','/broker-reviews':'/broker-reviews/','/partner':'/becomepartner/','/become-partner':'/becomepartner/','/trading-tools':'/tradingtools/','/tools-services':'/tradingtools/','/sign-in':'/sign-in/','/sign-up':'/sign-up/','/technical':'/technical/','/fundamental':'/fundamental/'};
      var pathMap={'/courses':'/courses/','/courses.html':'/courses/','/broker-reviews':'/broker-reviews/','/broker-reviews.html':'/broker-reviews/','/become-partner':'/becomepartner/','/partner':'/becomepartner/','/partner.html':'/becomepartner/','/trading-tools':'/tradingtools/','/tools-services.html':'/tradingtools/','/sign-in':'/sign-in/','/sign-up':'/sign-up/','/free-course':'/free-course/','/technical':'/technical/','/fundamental':'/fundamental/'};
      var out=routeMap[route]||pathMap[u.pathname]||u.pathname||'/';
      u.searchParams.delete('psp_route');var q=u.searchParams.toString();
      return out+(q?'?'+q:'')+(u.hash||'');
    }catch(_){return '/';}
  }

  var q=new URLSearchParams(location.search);
  var code=String(q.get('s')||q.get('ref')||'').trim().toLowerCase().replace(/[^a-z0-9-]/g,'').slice(0,80);
  if(!code){location.replace('/');return;}
  resolveShort(code).then(function(dest){location.replace(normalizeDestination(dest));}).catch(function(){location.replace('/');});
})();
</script>

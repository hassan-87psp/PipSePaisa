<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#075e54">
<meta name="robots" content="index,follow">
<title>PipSePaisa AI Assistant</title>
<link rel="icon" href="/favicon.png">
<style>
:root{--green:#075e54;--green2:#128c7e;--lime:#25d366;--paper:#efeae2;--ink:#111827;--muted:#667085;--orange:#f39522;--line:rgba(0,0,0,.08);--vh:100dvh}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d6d2ca;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}button,input{font:inherit}.app{height:var(--vh);max-width:620px;margin:0 auto;background:var(--paper);display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 0 35px rgba(0,0,0,.15)}.head{height:68px;min-height:68px;background:linear-gradient(135deg,#075e54,#0b7166);color:#fff;display:flex;align-items:center;padding:9px 12px;gap:10px;position:relative;z-index:10;box-shadow:0 2px 10px rgba(0,0,0,.18)}.avatar{width:45px;height:45px;border-radius:50%;background:#fff;border:2px solid rgba(255,255,255,.8);display:grid;place-items:center;overflow:hidden;flex:0 0 auto}.avatar img{width:100%;height:100%;object-fit:cover}.who{min-width:0;flex:1}.who b{display:block;font-size:15px;line-height:1.2}.status{display:flex;align-items:center;gap:6px;font-size:11px;color:rgba(255,255,255,.8);margin-top:3px}.dot{width:7px;height:7px;border-radius:50%;background:#43e56d;box-shadow:0 0 0 3px rgba(67,229,109,.15)}.ai-pill{font-size:9px;font-weight:800;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);padding:6px 8px;border-radius:999px;white-space:nowrap}.chat{flex:1;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch;padding:14px 11px 20px;background-color:var(--paper);background-image:radial-gradient(rgba(7,94,84,.055) 1px,transparent 1px),radial-gradient(rgba(243,149,34,.045) 1px,transparent 1px);background-position:0 0,13px 13px;background-size:26px 26px}.day{width:max-content;max-width:90%;margin:0 auto 12px;padding:5px 10px;border-radius:8px;background:#fff9;color:#667085;font-size:10px;box-shadow:0 1px 2px rgba(0,0,0,.08)}.row{display:flex;margin:7px 0;align-items:flex-end;gap:6px}.row.me{justify-content:flex-end}.bubble{max-width:84%;padding:9px 10px 7px;border-radius:10px;background:#fff;box-shadow:0 1px 1px rgba(0,0,0,.10);font-size:13.5px;line-height:1.42;position:relative;word-break:break-word}.row.me .bubble{background:#d9fdd3}.row.pending .ticks{opacity:.45}.row.failed .bubble{outline:1px solid rgba(180,35,24,.18)}.send-state{margin-left:4px;color:#98a2b3}.bubble a{color:#087b70;text-decoration:underline;font-weight:700}.meta{display:flex;justify-content:flex-end;align-items:center;gap:4px;font-size:8px;color:#8a939d;margin-top:5px}.ticks{font-size:10px;color:#53a6d8}.suggest{margin:8px 0 4px 2px;display:flex;flex-wrap:wrap;gap:7px}.suggest button{border:1px solid #c9d8d2;background:#fff;color:#0c665d;border-radius:16px;padding:8px 10px;font-size:11px;font-weight:700;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04)}.suggest button.zoom{background:#fff4e2;border-color:#f3c273;color:#8a5208}.typing{display:inline-flex;gap:4px;align-items:center;padding:12px 14px}.typing i{display:block;width:6px;height:6px;border-radius:50%;background:#8b949e;animation:dot 1.1s infinite}.typing i:nth-child(2){animation-delay:.14s}.typing i:nth-child(3){animation-delay:.28s}@keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-4px);opacity:1}}.cta-card{margin:8px 0 8px 0;max-width:88%;background:#fff;border:1px solid #efd09e;border-radius:14px;padding:10px;box-shadow:0 3px 9px rgba(0,0,0,.06)}.cta-card b{display:block;font-size:12px;margin-bottom:7px;color:#5d3b08}.cta-btn{width:100%;border:0;border-radius:10px;background:var(--orange);color:#17100a;font-size:12px;font-weight:900;padding:12px 10px;cursor:pointer}.cta-card small{display:block;color:#808b96;font-size:9px;line-height:1.35;margin-top:6px}.composer{background:#f0f2f5;border-top:1px solid rgba(0,0,0,.07);padding:8px max(9px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(9px,env(safe-area-inset-left));display:flex;align-items:flex-end;gap:7px;position:relative;z-index:12}.inputbox{flex:1;min-height:44px;max-height:108px;border:0;border-radius:22px;background:#fff;display:flex;align-items:center;padding:0 13px;box-shadow:0 1px 2px rgba(0,0,0,.07)}#msg{width:100%;height:22px;max-height:86px;border:0;outline:0;resize:none;background:transparent;color:#111827;font-size:14px;line-height:22px;padding:0;margin:0}.send{width:44px;height:44px;border:0;border-radius:50%;background:var(--green2);color:#fff;display:grid;place-items:center;cursor:pointer;flex:0 0 auto;box-shadow:0 2px 8px rgba(7,94,84,.25)}.send svg{width:20px;height:20px;fill:currentColor;transform:translateX(1px)}.send:disabled{opacity:.55}.notice{position:absolute;left:50%;bottom:76px;transform:translate(-50%,8px);z-index:30;background:#101828;color:#fff;border-radius:10px;padding:8px 10px;font-size:10px;opacity:0;pointer-events:none;transition:.2s;max-width:90%;text-align:center}.notice.show{opacity:1;transform:translate(-50%,0)}.retry{border:0;background:transparent;color:#0b7166;text-decoration:underline;font-weight:800;cursor:pointer;padding:0;margin-left:5px}.offline{display:none;padding:7px 10px;background:#fff3cd;color:#795d00;font-size:10px;text-align:center}.offline.show{display:block}@media(min-width:621px){body{padding:18px}.app{height:calc(100dvh - 36px);border-radius:18px;overflow:hidden}.chat{padding-left:18px;padding-right:18px}.bubble{max-width:76%}}@media(max-width:380px){.head{height:64px;min-height:64px}.avatar{width:41px;height:41px}.who b{font-size:14px}.bubble{font-size:13px;max-width:88%}.suggest button{font-size:10px;padding:7px 9px}}
</style>
</head>
<body>
<main class="app" id="app">
  <header class="head">
    <div class="avatar"><img src="/favicon.png" alt="PipSePaisa"></div>
    <div class="who"><b>PipSePaisa AI Assistant</b><span class="status"><i class="dot"></i><span id="statusText">Online · Replies instantly</span></span></div>
    <div class="ai-pill">AI</div>
  </header>
  <div class="offline" id="offlineBar">Connection slow — reconnecting…</div>
  <section class="chat" id="chat" aria-live="polite">
    <div class="day">PipSePaisa Free Course Help</div>
  </section>
  <div class="notice" id="notice"></div>
  <footer class="composer">
    <div class="inputbox"><textarea id="msg" rows="1" placeholder="Type a message…" autocomplete="off"></textarea></div>
    <button class="send" id="send" type="button" aria-label="Send message"><svg viewBox="0 0 24 24"><path d="M2.1 21.4 22.7 12 2.1 2.6 2 9.9l14.7 2.1L2 14.1z"/></svg></button>
  </footer>
</main>
<script>
(function(){'use strict';
const SB_URL='https://etfolhinohgmskbfjoyh.supabase.co';
const SB_KEY='sb_publishable_LgmfuH2ePiY8fxNGs7nTTA_FSS_oPBw';
const API=SB_URL+'/functions/v1/freecourse2-ai';
const TOKEN_KEY='psp-fc2-token-v305',VID_KEY='psp-fc2-visitor-v305';
const S={token:'',conversation:'',serverIds:new Set(),clientRows:new Map(),lastId:0,busy:false,poll:null,started:false};
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function uid(){try{return crypto.randomUUID()}catch(_){return Date.now().toString(36)+Math.random().toString(36).slice(2)}}
function visitorId(){let v='';try{v=localStorage.getItem(VID_KEY)||'';if(!v){v=uid();localStorage.setItem(VID_KEY,v)}}catch(_){v=uid()}return v}
function time(v){try{return new Date(v||Date.now()).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}catch(_){return''}}
function linkify(s){const safe=esc(s).replace(/\n/g,'<br>');return safe.replace(/(https?:\/\/[^\s<]+)/g,m=>`<a href="${m}" target="_blank" rel="noopener">${m}</a>`)}
function nearBottom(){const c=$('chat');return c.scrollHeight-c.scrollTop-c.clientHeight<140}
function scrollBottom(smooth=true,force=false){requestAnimationFrame(()=>{const c=$('chat');if(force||nearBottom())c.scrollTo({top:c.scrollHeight,behavior:smooth?'smooth':'auto'})})}
function notice(s){const n=$('notice');n.textContent=s;n.classList.add('show');clearTimeout(notice.t);notice.t=setTimeout(()=>n.classList.remove('show'),2400)}
function setStatus(text){$('statusText').textContent=text||'Online · Replies instantly'}
function bubbleHtml(m,status=''){return linkify(m.body||'')+`<div class="meta">${esc(time(m.created_at))}${status?`<span class="send-state">${esc(status)}</span>`:''}${m.sender_type==='visitor'?'<span class="ticks">✓✓</span>':''}</div>`}
function reconcileVisitor(m){const cid=String(m.client_message_id||'');if(!cid)return null;const row=S.clientRows.get(cid);if(!row)return null;const id=Number(m.id||0);if(id>0){row.dataset.id=String(id);S.serverIds.add(id);S.lastId=Math.max(S.lastId,id)}row.classList.remove('pending','failed');row.querySelector('.bubble').innerHTML=bubbleHtml(m);return row}
function messageNode(m){const id=Number(m.id||0),cid=String(m.client_message_id||'');if(id>0&&S.serverIds.has(id))return null;if(m.sender_type==='visitor'&&cid){const row=reconcileVisitor(m);if(row)return row}if(id>0){S.serverIds.add(id);S.lastId=Math.max(S.lastId,id)}if(cid&&S.clientRows.has(cid))return S.clientRows.get(cid);const row=document.createElement('div');row.className='row '+(m.sender_type==='visitor'?'me':'');if(id)row.dataset.id=String(id);if(cid)row.dataset.clientId=cid;const b=document.createElement('div');b.className='bubble';b.innerHTML=bubbleHtml(m);row.appendChild(b);$('chat').appendChild(row);if(cid&&m.sender_type==='visitor')S.clientRows.set(cid,row);return row}
function optimisticMessage(text,cid){let row=S.clientRows.get(cid);if(row)return row;row=document.createElement('div');row.className='row me pending';row.dataset.clientId=cid;const b=document.createElement('div');b.className='bubble';b.innerHTML=bubbleHtml({sender_type:'visitor',body:text,created_at:new Date().toISOString()},'Sending…');row.appendChild(b);$('chat').appendChild(row);S.clientRows.set(cid,row);return row}
function markFailed(cid,text){const row=S.clientRows.get(cid);if(!row)return;row.classList.remove('pending');row.classList.add('failed');const b=row.querySelector('.bubble');b.innerHTML=linkify(text)+`<div class="meta"><span style="color:#b42318">Not sent</span><button class="retry" type="button">Retry</button></div>`;b.querySelector('.retry').onclick=()=>sendMessage(text,cid,true)}
function showTyping(){if($('typingRow'))return;const r=document.createElement('div');r.className='row';r.id='typingRow';r.innerHTML='<div class="bubble typing"><i></i><i></i><i></i></div>';$('chat').appendChild(r);scrollBottom(true,true)}
function hideTyping(){$('typingRow')?.remove()}
function clearSuggestions(){$('suggestions')?.remove()}
function renderSuggestions(list){clearSuggestions();if(!Array.isArray(list)||!list.length)return;const wrap=document.createElement('div');wrap.className='suggest';wrap.id='suggestions';list.slice(0,4).forEach(t=>{const b=document.createElement('button');b.type='button';b.textContent=t;if(/zoom|join|seat/i.test(t))b.classList.add('zoom');b.onclick=()=>{clearSuggestions();sendMessage(t)};wrap.appendChild(b)});$('chat').appendChild(wrap);scrollBottom(false,true)}
function renderCta(url,label,target){document.querySelectorAll('.cta-card[data-current="1"]').forEach(x=>x.dataset.current='0');const c=document.createElement('div');c.className='cta-card';c.dataset.current='1';c.innerHTML=`<b>${target==='fundamental'?'Free Fundamental Course':'Sir Sajid — Free Technical Course Batch 3'}</b><button class="cta-btn" type="button">${esc(label||'GET MY FREE ZOOM LINK →')}</button><small>${target==='fundamental'?'Open the existing PipSePaisa registration page.':'4 live sessions · Starts 28 September · 100% Free'}</small>`;c.querySelector('button').onclick=()=>openCta(target,url);$('chat').appendChild(c);scrollBottom(true,true)}
async function apiOnce(payload,timeout=14000){const ctrl=new AbortController();const t=setTimeout(()=>ctrl.abort(),timeout);try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY},body:JSON.stringify(payload),cache:'no-store',signal:ctrl.signal});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Chat request failed');return d}finally{clearTimeout(t)}}
async function api(payload,timeout=14000,retry=false){try{return await apiOnce(payload,timeout)}catch(e){if(!retry)throw e;await new Promise(r=>setTimeout(r,350));return await apiOnce(payload,timeout)}}
function meta(){const q=new URLSearchParams(location.search);return{utm_source:q.get('utm_source')||'freecourse2',utm_medium:q.get('utm_medium')||'ai-chat',utm_campaign:q.get('utm_campaign')||'batch3',ref:q.get('ref')||'',referrer:document.referrer||'',path:location.pathname,query:location.search}}
async function start(){if(S.started)return;S.started=true;setStatus('Connecting…');try{try{S.token=localStorage.getItem(TOKEN_KEY)||''}catch(_){}const d=await api({mode:'start',visitor_token:S.token,visitor_id:visitorId(),meta:meta()},12000,true);S.token=d.visitor_token||S.token;S.conversation=d.conversation_id||'';try{localStorage.setItem(TOKEN_KEY,S.token)}catch(_){};if(Array.isArray(d.messages)&&d.messages.length){d.messages.forEach(messageNode)}else{messageNode({id:0,sender_type:'ai',body:d.greeting||'Assalam o Alaikum 👋 Main PipSePaisa AI Assistant hoon. Jo poochna ho, message karein.',created_at:new Date().toISOString()})}renderSuggestions(d.suggestions||[]);setStatus(d.ai_enabled===false?'Human support active':'Online · Replies instantly');$('offlineBar').classList.remove('show');poll();scrollBottom(false,true)}catch(e){console.error(e);setStatus('Reconnecting…');$('offlineBar').classList.add('show');S.started=false;setTimeout(start,1800)}}
async function sendMessage(text,existingCid='',isRetry=false){text=String(text||'').trim();if(!text||S.busy)return;if(!S.conversation){notice('Chat is connecting…');return}const cid=existingCid||uid();S.busy=true;$('send').disabled=true;if(!isRetry){$('msg').value='';resizeInput();clearSuggestions()}const row=optimisticMessage(text,cid);row.classList.remove('failed');row.classList.add('pending');row.querySelector('.bubble').innerHTML=bubbleHtml({sender_type:'visitor',body:text,created_at:new Date().toISOString()},'Sending…');scrollBottom(true,true);showTyping();setStatus('PipSePaisa AI is typing…');try{const d=await api({mode:'message',conversation_id:S.conversation,visitor_token:S.token,message:text,client_message_id:cid},12000,true);if(d.visitor_message)messageNode(d.visitor_message);if(d.waiting_for_admin){hideTyping();setStatus('Human support active');renderSuggestions(d.suggestions||[]);notice('Admin will reply here shortly.')}else{hideTyping();if(d.message)messageNode(d.message);if(d.show_cta&&d.cta_url)renderCta(d.cta_url,d.cta_label,/fundamental/i.test(d.cta_label||'')?'fundamental':'technical');renderSuggestions(d.suggestions||[]);setStatus('Online · Replies instantly')}fetchNew(false)}catch(e){hideTyping();console.error(e);setStatus('Online · Replies instantly');markFailed(cid,text);notice('Connection issue — message safe hai, Retry tap karein.')}finally{S.busy=false;$('send').disabled=false;scrollBottom(true,true)}}
async function fetchNew(showSug=false){if(!S.conversation)return;const wasNear=nearBottom();try{const d=await api({mode:'poll',conversation_id:S.conversation,visitor_token:S.token,after_id:S.lastId},7000,false);let addedAi=false;(d.messages||[]).forEach(m=>{const node=messageNode(m);if(node&&m.sender_type!=='visitor')addedAi=true});if(d.status==='closed'){setStatus('Chat closed');$('send').disabled=true;$('msg').disabled=true}else{if(d.ai_enabled===false)setStatus('Human support active');$('send').disabled=false;$('msg').disabled=false}$('offlineBar').classList.remove('show');if(wasNear)scrollBottom(false,true);if(showSug&&addedAi)renderSuggestions(['Course Details','Start Date','GET MY FREE ZOOM LINK'])}catch(_){} }
function poll(){clearInterval(S.poll);S.poll=setInterval(()=>{if(!document.hidden&&!S.busy)fetchNew(false)},2200)}
async function openCta(target,fallback){if(!S.conversation)return location.assign(fallback);let url=fallback;try{const d=await api({mode:'cta',conversation_id:S.conversation,visitor_token:S.token,target},5000,true);url=d.url||fallback}catch(_){}location.assign(url)}
function resizeInput(){const x=$('msg');x.style.height='22px';x.style.height=Math.min(86,x.scrollHeight)+'px'}
$('send').onclick=()=>sendMessage($('msg').value);$('msg').addEventListener('input',resizeInput);$('msg').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage($('msg').value)}});document.addEventListener('visibilitychange',()=>{if(!document.hidden){fetchNew(false);scrollBottom(false,false)}});
function viewport(){const h=Math.round(window.visualViewport?.height||window.innerHeight);document.documentElement.style.setProperty('--vh',h+'px');if(nearBottom())scrollBottom(false,true)}window.addEventListener('resize',viewport,{passive:true});window.visualViewport?.addEventListener('resize',viewport,{passive:true});viewport();start();
})();
</script>
</body>
</html>

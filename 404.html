<script>
(function(){
  var p=String(location.pathname||'/');
  while(p.length>1 && p.charAt(p.length-1)==='/') p=p.slice(0,-1);

  if(p.indexOf('/r/')===0){
    var code=p.slice(3);
    if(code && code.indexOf('/')===-1){
      location.replace('/r/?s='+encodeURIComponent(code));
      return;
    }
  }

  var map={
    '/courses':'/courses/',
    '/broker-reviews':'/broker-reviews/',
    '/partner':'/becomepartner/',
    '/become-partner':'/becomepartner/',
    '/trading-tools':'/tradingtools/',
    '/trading-tools-services':'/tradingtools/',
    '/tools-services':'/tradingtools/',
    '/courses.html':'/courses/',
    '/broker-reviews.html':'/broker-reviews/',
    '/partner.html':'/becomepartner/',
    '/tools-services.html':'/tradingtools/'
  };
  var dest=map[p];
  if(dest){
    location.replace(dest+(location.search||'')+(location.hash||''));
    return;
  }
  document.documentElement.className='show';
})();
</script>
<style>
html:not(.show) body{visibility:hidden}
body{font-family:system-ui;background:#fff8ed;color:#111827;display:grid;place-items:center;min-height:100vh;margin:0}
.c{text-align:center}.c a{display:inline-block;margin-top:12px;padding:10px 14px;border-radius:10px;background:#FB9201;color:#111;text-decoration:none;font-weight:800}
</style>

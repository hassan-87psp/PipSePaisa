<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Email Verified | PipSePaisa</title>
  <link rel="icon" href="favicon.png">
  <style>
    :root{--gold:#f59e0b;--navy:#0b172a;--muted:#64748b;--green:#047857}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:linear-gradient(145deg,#07111f,#111d31);font-family:Arial,Helvetica,sans-serif;color:#111827}
    .card{width:min(520px,100%);background:#fff;border-radius:22px;padding:34px 28px;text-align:center;box-shadow:0 28px 80px rgba(0,0,0,.35)}
    .brand{font-size:26px;font-weight:900;color:var(--navy);margin-bottom:25px}.brand span{color:var(--gold)}
    .icon{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;margin:0 auto 18px;background:#ecfdf5;color:var(--green);font-size:34px}
    h1{margin:0 0 10px;font-size:26px}.status{margin:0 auto 22px;max-width:390px;color:var(--muted);line-height:1.65;font-size:14px}
    .btn{display:inline-flex;justify-content:center;align-items:center;width:100%;padding:14px 20px;border-radius:11px;background:var(--gold);color:#111827;text-decoration:none;font-weight:900;border:0;cursor:pointer}.btn[aria-disabled="true"]{opacity:.6;pointer-events:none}
    .small{font-size:12px;color:var(--muted);margin-top:16px}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">Pip<span>Se</span>Paisa</div>
    <div class="icon" id="icon">⏳</div>
    <h1 id="title">Verifying Your Email</h1>
    <p class="status" id="status">Please wait while we securely activate your account.</p>
    <a class="btn" id="loginBtn" href="index.html#login" aria-disabled="true">Continue to Sign In</a>
    <p class="small">For your security, verification does not automatically open your dashboard.</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (async function(){
      const title=document.getElementById('title'),status=document.getElementById('status'),icon=document.getElementById('icon'),btn=document.getElementById('loginBtn');
      try{
        sessionStorage.setItem('psp-manual-signin-required','1');
        sessionStorage.removeItem('psp-signup-pending');
        const client=window.supabase.createClient(
          'https://etfolhinohgmskbfjoyh.supabase.co',
          'sb_publishable_LgmfuH2ePiY8fxNGs7nTTA_FSS_oPBw',
          {auth:{storageKey:'pipsepaisa-verification-temporary',persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}}
        );
        const params=new URLSearchParams(location.search);
        const code=params.get('code');
        let session=null;
        if(code){
          const result=await client.auth.exchangeCodeForSession(code);
          if(result.error)throw result.error;
          session=result.data?.session||null;
        }else if(location.hash){
          const hash=new URLSearchParams(location.hash.replace(/^#/,''));
          const access_token=hash.get('access_token'),refresh_token=hash.get('refresh_token');
          if(access_token&&refresh_token){
            const result=await client.auth.setSession({access_token,refresh_token});
            if(result.error)throw result.error;
            session=result.data?.session||null;
          }
        }
        if(!session){
          const current=await client.auth.getSession();
          if(current.error)throw current.error;
          session=current.data?.session||null;
        }
        if(!session)throw new Error('Verification session was not created.');

        // Send the dynamic, totally-free PIN instructions while this temporary
        // verification session is authenticated. Email failure does not block verification.
        try{
          const name=session.user?.user_metadata?.full_name||session.user?.email?.split('@')[0]||'Student';
          const emailResponse=await fetch('https://etfolhinohgmskbfjoyh.supabase.co/functions/v1/send-course-email',{
            method:'POST',
            headers:{
              'Content-Type':'application/json',
              'apikey':'sb_publishable_LgmfuH2ePiY8fxNGs7nTTA_FSS_oPBw',
              'Authorization':`Bearer ${session.access_token}`,
              'x-client-info':'pipsepaisa-verification-v21'
            },
            body:JSON.stringify({type:'pin_access_welcome',user_name:name})
          });
          const emailData=await emailResponse.json().catch(()=>({}));
          if(!emailResponse.ok||emailData?.success===false)throw new Error(emailData?.error||`PIN email request failed (${emailResponse.status}).`);
        }catch(emailError){console.warn('PIN welcome email could not be sent',emailError);}

        try{await client.auth.signOut({scope:'local'});}catch(_){ }
        localStorage.removeItem('pipsepaisa-user-auth-v2');
        icon.textContent='✓';title.textContent='Email Verified Successfully';
        status.textContent='Your account is active. We also sent your free Access PIN instructions. Please sign in manually using your email and password.';
        btn.href='index.html#auth-login';btn.setAttribute('aria-disabled','false');
        try{history.replaceState(null,'','email-verified.html');}catch(_){ }
      }catch(error){
        console.error(error);icon.textContent='!';title.textContent='Verification Link Could Not Be Confirmed';
        status.textContent='The link may be expired or already used. Open PipSePaisa and request a new verification email.';
        btn.href='index.html#auth-login';btn.textContent='Back to Sign In';btn.setAttribute('aria-disabled','false');
      }
    })();
  </script>
</body>
</html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify Account | PipSePaisa</title><link rel="icon" href="/favicon.png"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f1e7;font-family:'Segoe UI',Arial,sans-serif;color:#0f172a;padding:18px}.card{width:min(520px,100%);background:#fff;border:1px solid #ead7b7;border-radius:20px;padding:30px;text-align:center;box-shadow:0 22px 60px rgba(82,55,20,.12)}img{width:62px;height:62px}.icon{font-size:42px;margin:16px 0 8px}h1{font-size:24px;margin:0 0 8px}p{font-size:13px;line-height:1.65;color:#64748b}.btn{display:inline-block;margin-top:13px;background:#fb9201;color:#111827;text-decoration:none;padding:12px 17px;border-radius:10px;font-weight:900}.bad{color:#b91c1c}.pulse{display:inline-flex;gap:5px;align-items:center;justify-content:center;margin-top:10px}.pulse i{width:6px;height:6px;border-radius:50%;background:#fb9201;animation:p 1s infinite ease-in-out}.pulse i:nth-child(2){animation-delay:.12s}.pulse i:nth-child(3){animation-delay:.24s}@keyframes p{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1.15)}}</style></head><body><div class="card"><img src="/icon-192.png"><div id="icon" class="icon">⚡</div><h1 id="title">Verifying Your Email…</h1><p id="text">Securely confirming your PipSePaisa account.</p><div id="pulse" class="pulse"><i></i><i></i><i></i></div><a id="btn" class="btn" href="/?profile=1" style="display:none">Continue to Profile →</a></div><script>
const URL='https://etfolhinohgmskbfjoyh.supabase.co',KEY='sb_publishable_LgmfuH2ePiY8fxNGs7nTTA_FSS_oPBw';
const $=id=>document.getElementById(id);const icon=$('icon'),title=$('title'),text=$('text'),btn=$('btn'),pulse=$('pulse');
function finish(ok,msg){pulse.style.display='none';icon.textContent=ok?'✅':'⚠️';title.textContent=ok?'Email Verified Successfully':'Verification Could Not Be Completed';text.textContent=msg;text.className=ok?'':'bad';btn.textContent=ok?'Opening Profile…':'Back to Profile';btn.style.display='inline-block';if(ok)setTimeout(()=>location.replace('/?profile=1&verified=1'),650)}
async function sha256Hex(value){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(value));return Array.from(new Uint8Array(d)).map(b=>b.toString(16).padStart(2,'0')).join('')}
async function fastConfirm(token){const hash=await sha256Hex(token);const ctl=new AbortController();const timer=setTimeout(()=>ctl.abort(),5000);try{const r=await fetch(URL+'/rest/v1/rpc/psp_confirm_email_verification_hash',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({p_token_hash:hash}),signal:ctl.signal});const d=await r.json().catch(()=>null);if(!r.ok)throw new Error(d?.message||d?.error||'Verification failed.');const row=Array.isArray(d)?d[0]:d;if(!row?.success)throw new Error(row?.message||'Verification failed.');return row}finally{clearTimeout(timer)}}
async function fallbackConfirm(token){const ctl=new AbortController();const timer=setTimeout(()=>ctl.abort(),7000);try{const r=await fetch(URL+'/functions/v1/confirm-account-verification',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({token}),signal:ctl.signal});const d=await r.json().catch(()=>null);if(!r.ok||!d?.success)throw new Error(d?.error||'Verification failed.');return d}finally{clearTimeout(timer)}}
(async()=>{const token=new URLSearchParams(location.search).get('token')||'';if(!/^[a-f0-9]{64}$/i.test(token)){finish(false,'The verification link is invalid or incomplete. Request a new email from Profile.');return}try{try{await fastConfirm(token)}catch(first){console.warn('Fast verification unavailable; using secure fallback.',first);await fallbackConfirm(token)}finish(true,'Your email is verified. Redirecting you to Profile now.')}catch(e){finish(false,e?.name==='AbortError'?'Verification timed out. Please try the link again or request a new email from Profile.':(e?.message||'Request a new verification email from Profile.'))}})();
</script></body></html>

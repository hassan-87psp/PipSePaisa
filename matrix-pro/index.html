<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050b11"><title>PipSePaisa | Matrix PRO Dashboard</title><meta name="description" content="Premium PipSePaisa Matrix PRO indicator-inspired Levels, Market Overview and Control Center website interface"><style>

px;display:flex;gap:3px}.acts button{border:1px solid var(--gold);background:#07101b;border-radius:4px;width:22px;height:21px;color:#ffbd3e;font-size:14px;font-weight:bold}.section{margin-top:1px}.stitle{height:14px;display:flex;align-items:center;gap:4px;font-weight:900;font-size:7px}.num{width:12px;height:12px;border-radius:100%;background:linear-gradient(#ffe183,#f2a315);display:grid;place-items:center;color:#100b04;font-weight:900;font-size:8px}.group{display:grid;gap:4px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.four{grid-template-columns:repeat(4,minmax(0,1fr))}.box{height:31px;border:1px solid #385368;border-radius:5px;background:linear-gradient(100deg,#0b2131,#08151e);min-width:0;padding:4px 4px;overflow:hidden}.box.green{border-color:#008f5d;background:linear-gradient(100deg,#063e2a,#071b17)}.box.red{border-color:#b03952;background:linear-gradient(100deg,#360d1a,#130b13)}.box.gold{border-color:#ad7c24;background:linear-gradient(100deg,#432706,#1f150c)}.box.blue{border-color:#217ca9;background:linear-gradient(100deg,#102f4a,#0a1721)}.box.gray{border-color:#70818c}.box.large{height:33px}.box.small{height:28px}.box.tall{height:35px}.box .name{font-size:5.6px;font-weight:800;color:#a7b9c7;white-space:nowrap}.box .val{font-size:9px;font-weight:850;margin-top:6px;white-space:nowrap}.box.green .val{color:var(--green)}.box.red .val{color:var(--red)}.box.gold .val{color:var(--gold)}.box.blue .val{color:var(--blue)}.box.ico{padding-left:30px;position:relative}.box .symbol{position:absolute;left:6px;top:7px;font-size:16px;font-weight:900;color:inherit}.box.green .symbol{color:#27e49b}.box.red .symbol{color:#fe4f69}.box.gold .symbol{color:#ffc447}.box.blue .symbol{color:#50bdf0}.box.ico .val{margin-top:3px}.box.mini .val{font-size:7.7px}.box .sub{font-size:6.4px;color:#b8cbdb}.license{position:absolute;bottom:21px;left:8px;right:8px;height:16px;border:1px solid #179a5c;border-radius:4px;background:#062c24;display:flex;align-items:center;padding:0 4px;color:#23eaa0;gap:5px;font-size:8px;font-weight:800}.license .lt{color:#d8e6e1;font-size:7px}.license .tm{margin-left:14px}.license .status{margin-left:auto;border-left:1px solid #00ad72;padding-left:6px}.footer{position:absolute;bottom:5px;left:8px;right:8px;display:grid;grid-template-columns:1.3fr .9fr .7fr;gap:3px;height:13px;align-items:center}.footer span{white-space:nowrap;font-size:5.8px;font-weight:850}.footer span:nth-child(2){color:var(--gold);text-align:center;border-left:1px solid #9a702a;border-right:1px solid #9a702a}.footer span:last-child{text-align:right}.settingshead{padding:4px 5px 0;height:39px}.settingshead strong{font-size:11.5px;white-space:nowrap}.settingshead em{font-style:normal;color:var(--gold)}.settingshead small{display:block;font-size:6px;color:#adc1cd;letter-spacing:.45px;margin-top:3px}.list{margin:2px 3px;display:grid;gap:3px}.r{height:27px;display:flex;align-items:center;gap:5px;padding:2px 4px;border-radius:5px;border:1px solid #30475a;background:linear-gradient(95deg,#10202b,#05111c)}.r .n{width:19px;height:20px;border-radius:4px;background:#70440d;color:#fff;display:grid;place-items:center;font-size:9px;font-weight:900}.r.good .n{background:#06502a}.r.bad .n{background:#671426}.r .sym{width:16px;text-align:center;font-size:13px;color:#ffc33f}.r.good .sym{color:#17dc73}.r.bad .sym{color:#f94a60}.r .desc{flex:1;min-width:0}.r .desc strong{display:block;font-size:7.3px}.r .desc small{display:block;color:#adbdc9;font-size:5.2px;margin-top:2px;white-space:nowrap}.seg{display:flex;flex-shrink:0}.seg button{font-size:7.5px;font-weight:750;background:#091826;color:#b5c5d0;border:1px solid #40566a;padding:0 6px;height:19px;min-width:31px}.seg button:first-child{border-radius:4px 0 0 4px}.seg button:last-child{border-radius:0 4px 4px 0}.seg button.sel{background:#ffba39;border-color:#d89620;color:#090c10}.seg button.sel.good{background:#34e76d;border-color:#23b85a;color:#04200b}.seg button.danger{border-radius:4px;color:#fe5674;border-color:#ef3152;background:#2b0b17;min-width:52px}.seg button.theme{width:84px;border-radius:4px;color:var(--gold)}.settingsfoot{position:absolute;bottom:8px;left:9px;right:9px;font-size:7.5px;font-weight:850;color:#efb021;display:flex;justify-content:space-between}.settingsfoot span:last-child{color:#e9f0f6;border-left:1px solid #996f24;padding-left:10px;font-size:6.5px}.disclaimer{max-width:1010px;margin:22px auto;text-align:center;font-size:11px;color:#98a8b7;line-height:1.6}.disclaimer b{color:#e5f0f4}.reopen{padding:12px 16px;background:#081d29;color:var(--gold);border:1px solid var(--gold);border-radius:8px}.hide{display:none!important}@media(max-width:360px){.boards{transform:scale(.95);transform-origin:top center}.shell{padding:15px 6px}.intro{display:block}.intro h1{font-size:17px}.intro a{display:inline-block;margin-top:10px}}</style></head><body><main class="shell"><header class="intro"><div><small>PIPSEPAISA · GROW WITH US</small><h1>MATRIX PRO Control Center</h1><p>Reference-matched website interface preview</p></div><a href="/">← PipSePaisa Home</a></header><div class="boards" id="boards"></div><p class="disclaimer"><b>Interface preview:</b> Zone prices, bias and license timer shown here are sample reference values, not live trading data. Live MT5 integration requires a separate data service.</p></main><script>
const st={theme:'DARK',grid:true,shift:false,view:'FULL',sessions:true,volume:true,hidden:false};const app=document.getElementById('boards');
const brand=()=>'<div class="logo"><img src="/email-assets/pipsepaisa-mark.png" alt="PipSePaisa logo"><div><div class="logoword">PipSe<b>Paisa</b></div><div class="tag">— GROW WITH US —</div></div></div><div class="prod"><b>MATRIX PRO</b><small>INSTITUTIONAL</small></div>';
const acts=()=>'<div class="acts"><button title="Switch panels" data-a="switch">›</button><button title="Settings" data-a="settings">⚙</button><button title="Hide panels" data-a="hide">−</button></div>';
const header=()=>'<div class="bhead">'+brand()+acts()+'</div>';
const title=(n,t)=>'<div class="stitle"><span class="num">'+n+'</span>'+t+'</div>';
const card=(kind,name,val,ic='',cl='')=>'<div class="box '+kind+' '+(ic?'ico ':'')+cl+'">'+(ic?'<span class="symbol">'+ic+'</span>':'')+'<div class="name">'+name+'</div><div class="val">'+val+'</div></div>';
const footer=()=>'<div class="license"><span>⛨</span><span class="lt">LICENSE</span><span class="tm">31d 10h 30m 51s</span><span class="status">◉ ACTIVE</span></div><div class="footer"><span>🟢 WA +60 11-5696 1157</span><span>pipsepaisa.com</span><span>▥ TRADE SMARTER</span></div>';
const levels=()=>'<div class="board levels">'+header()+'<div class="section">'+title(1,'NEAREST ACTIVE ZONES')+'<div class="group two">'+card('green','NEAREST BUY ZONE','4146.90-4184.54','↗','large')+card('red','NEAREST SELL ZONE','4369.13-4371.13','↘','large')+'</div></div><div class="section">'+title(2,'STRUCTURE LEVELS')+'<div class="group three">'+card('gold','M-SHIFT','3 ACTIVE','▥')+card('red','M-PEAK','3 LEVELS','⌁')+card('blue','M-BASE','2 LEVELS','▰')+'</div></div><div class="section">'+title(3,'ZONE FRESHNESS')+'<div class="group three">'+card('green','FRESH','16','✔')+card('blue','TESTED','0','◷')+card('gray','OTHER','0','☷')+'</div></div><div class="section">'+title(4,'DISPLAY / BIAS')+'<div class="group two">'+card('gray','ZONE VIEW',st.view,'▣')+card('red','BIAS','BEARISH','▥')+'</div></div>'+footer()+'</div>';
const overview=()=>'<div class="board overview">'+header()+'<div class="section">'+title(1,'MARKET OVERVIEW')+'<div class="group two">'+card('blue','SYMBOL / TIMEFRAME','XAUUSD.s | M15','▣','tall')+card('green','MARKET STRUCTURE','BEARISH','↗','tall')+'</div></div><div class="section">'+title(2,'STRUCTURE ENGINE')+'<div class="group three">'+card('green','DIRECTION','BEARISH','↗')+card('blue','LAST EVENT','D-CHOCH','□','mini')+card('gold','PHASE','IMPULSE','➜')+'</div></div><div class="section">'+title(3,'TRADING SESSIONS')+'<div class="group two">'+card('blue','ACTIVE SESSION','LONDON','◷')+card('gold','NEXT SESSION','NEW YORK 01h 30m','◷','mini')+'</div></div><div class="section">'+title(4,'MULTI-TIMEFRAME BIAS')+'<div class="group four">'+card('blue','M15','BEAR','','small')+card('blue','H1','BEAR','','small')+card('blue','H4','BEAR','','small')+card('blue','D1','BEAR','','small')+'</div></div>'+footer()+'</div>';
const tog=(field)=>'<div class="seg"><button data-field="'+field+'" data-v="OFF" class="'+(!st[field]?'sel':'')+'">OFF</button><button data-field="'+field+'" data-v="ON" class="'+(st[field]?'sel '+(['sessions','volume'].includes(field)?'good':''):'')+'">ON</button></div>';
const rr=(n,ic,t,description,controls,style='')=>'<div class="r '+style+'"><span class="n">'+n+'</span><span class="sym">'+ic+'</span><div class="desc"><strong>'+t+'</strong><small>'+description+'</small></div>'+controls+'</div>';
const settings=()=>'<div class="board settings"><div class="settingshead"><strong>MATRIX <em>CONTROL</em> CENTER</strong><small>PERSONALIZE YOUR CHART EXPERIENCE</small>'+acts()+'</div><div class="list">'+rr('01','☷','CHART THEME','Choose your preferred color theme','<div class="seg"><button class="theme" data-a="theme">'+st.theme+' ⌄</button></div>')+rr('02','▦','GRID','Show / hide chart grid',tog('grid'))+rr('03','✣','SHIFT','Shift indicator position',tog('shift'))+rr('04','⛶','VIEW MODE','Compact or full panel','<div class="seg"><button data-field="view" data-v="COMPACT" class="'+(st.view==='COMPACT'?'sel':'')+'">COMPACT</button><button data-field="view" data-v="FULL" class="'+(st.view==='FULL'?'sel':'')+'">FULL</button></div>')+rr('05','▥','SESSIONS','Show trading sessions',tog('sessions'),'good')+rr('06','▮','VOLUME','Show volume information',tog('volume'),'good')+rr('07','✕','CLOSE PANEL','Hide the indicator panel','<div class="seg"><button class="danger" data-a="hide">✕ CLOSE</button></div>','bad')+'</div><div class="settingsfoot"><span>PIPSEPAISA · GROW WITH US</span><span>▥ TRADE SMARTER</span></div></div>';
function render(){app.innerHTML=st.hidden?'<button class="reopen" data-a="show">SHOW MATRIX PRO PANELS →</button>':'<div class="wrap">'+levels()+'<div class="caption">01 / NEAREST ACTIVE ZONES</div></div><div class="wrap">'+overview()+'<div class="caption">02 / MARKET OVERVIEW</div></div><div class="wrap">'+settings()+'<div class="caption">03 / MATRIX CONTROL CENTER</div></div>'; }
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.field){let f=b.dataset.field;st[f]=b.dataset.v==='ON'?true:b.dataset.v==='OFF'?false:b.dataset.v;render();return;}const a=b.dataset.a;if(a==='hide')st.hidden=true;else if(a==='show')st.hidden=false;else if(a==='theme')st.theme=st.theme==='DARK'?'LIGHT':'DARK';else if(a==='switch'){const first=app.firstElementChild;app.appendChild(first);return;}else if(a==='settings'){app.querySelector('.settings')?.scrollIntoView({behavior:'smooth',block:'nearest'});return;}render();});
render();</script></body></html>

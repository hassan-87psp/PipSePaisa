<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset Password | PipSePaisa</title>
  <link rel="icon" href="favicon.png">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--orange:#f59a00;--orange2:#df7300;--navy:#08172b;--cream:#fffaf2;--muted:#6b7280;--green:#0f9f6e;--red:#dc2626}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,Arial,sans-serif;background:radial-gradient(circle at 78% 20%,rgba(245,154,0,.18),transparent 34%),linear-gradient(135deg,#071426,#0e223e);display:grid;place-items:center;padding:24px;color:#111827}
    .card{width:min(440px,100%);background:var(--cream);border:1px solid rgba(245,154,0,.36);border-radius:22px;padding:30px;box-shadow:0 28px 80px rgba(0,0,0,.38)}
    .brand{display:flex;align-items:center;justify-content:center;gap:11px;margin-bottom:18px}.brand img{width:58px;height:58px;border-radius:15px}.brand strong{font-size:25px;color:#0a1730}.brand strong span{color:var(--orange2)}
    h1{text-align:center;margin:0 0 7px;font-size:25px}.sub{text-align:center;color:var(--muted);font-size:13px;line-height:1.55;margin:0 0 23px}
    label{display:block;font-size:12px;font-weight:800;margin:0 0 7px}.field{margin-bottom:14px;position:relative}.field input{width:100%;height:48px;border:1px solid #d7c8b1;border-radius:11px;padding:0 46px 0 14px;background:#fff;color:#111827;font-size:14px;outline:none}.field input:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(245,154,0,.15)}
    .show{position:absolute;right:9px;bottom:8px;width:34px;height:34px;border:0;border-radius:8px;background:#fff3df;cursor:pointer}
    .btn{width:100%;min-height:50px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--orange),var(--orange2));color:#111;font-size:15px;font-weight:900;cursor:pointer;margin-top:5px}.btn:disabled{opacity:.65;cursor:not-allowed}
    .msg{display:none;margin:0 0 16px;padding:12px 13px;border-radius:10px;font-size:12px;line-height:1.5}.msg.info{display:block;background:#eff6ff;color:#1d4ed8}.msg.ok{display:block;background:#e9f9f1;color:#087553}.msg.err{display:block;background:#feeceb;color:#b42318}
    .back{display:block;text-align:center;margin-top:17px;color:#b85d00;font-weight:800;font-size:12px;text-decoration:none}
    .security{text-align:center;margin-top:17px;font-size:10px;color:#7b8493}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><img src="favicon.png" alt="PipSePaisa"><strong>Pip<span>Se</span>Paisa</strong></div>
    <h1>Set New Password</h1>
    <p class="sub">Create a secure new password for your PipSePaisa account.</p>
    <div id="message" class="msg info">Checking your secure reset link…</div>
    <form id="resetForm" hidden>
      <div class="field"><label for="newPassword">New Password</label><input id="newPassword" type="password" minlength="8" autocomplete="new-password" placeholder="Minimum 8 characters" required><button class="show" type="button" data-target="newPassword">👁</button></div>
      <div class="field"><label for="confirmPassword">Confirm New Password</label><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" placeholder="Enter password again" required><button class="show" type="button" data-target="confirmPassword">👁</button></div>
      <button id="submitBtn" class="btn" type="submit">Update Password</button>
    </form>
    <a class="back" href="/#auth-login">← Back to Login</a>
    <div class="security">🔒 Secure password reset powered by PipSePaisa</div>
  </main>
<script>
(() => {
  const SUPABASE_URL='https://etfolhinohgmskbfjoyh.supabase.co';
  const SUPABASE_KEY='sb_publishable_LgmfuH2ePiY8fxNGs7nTTA_FSS_oPBw';
  const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storageKey:'pipsepaisa-user-auth-v2',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  const form=document.getElementById('resetForm'),msg=document.getElementById('message'),btn=document.getElementById('submitBtn');
  function show(type,text){msg.className='msg '+type;msg.textContent=text;}
  async function init(){
    try{
      const {data,error}=await client.auth.getSession();
      if(error)throw error;
      if(data&&data.session){form.hidden=false;show('ok','Reset link verified. Enter your new password below.');return;}
      // Give the SDK a moment to exchange recovery parameters.
      await new Promise(r=>setTimeout(r,900));
      const retry=await client.auth.getSession();
      if(retry.data&&retry.data.session){form.hidden=false;show('ok','Reset link verified. Enter your new password below.');return;}
      show('err','This reset link is invalid or has expired. Please request a new link from the login page.');
    }catch(e){show('err',e.message||'Could not verify the reset link.');}
  }
  document.querySelectorAll('.show').forEach(b=>b.addEventListener('click',()=>{const i=document.getElementById(b.dataset.target);i.type=i.type==='password'?'text':'password';}));
  form.addEventListener('submit',async e=>{
    e.preventDefault();const p=document.getElementById('newPassword').value,c=document.getElementById('confirmPassword').value;
    if(p.length<8){show('err','Password must be at least 8 characters.');return;}if(p!==c){show('err','Passwords do not match.');return;}
    btn.disabled=true;btn.textContent='Updating…';
    try{const {error}=await client.auth.updateUser({password:p});if(error)throw error;show('ok','Password updated successfully. You can now log in with your new password.');form.hidden=true;await client.auth.signOut();setTimeout(()=>location.href='/#auth-login',900);}catch(e){show('err',e.message||'Password could not be updated.');btn.disabled=false;btn.textContent='Update Password';}
  });
  client.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'&&session){form.hidden=false;show('ok','Reset link verified. Enter your new password below.');}});
  init();
})();
</script>
</body>
</html>

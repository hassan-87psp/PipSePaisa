name: PipSePaisa Quality Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Run project quality checks
        run: node scripts/quality-check.mjs
      - name: Verify admin session restoration and page loading
        run: |
          node --check admin-core-v406.js
          node --check admin-dashboard-v181.js
          node --test tests/admin-page-loading.test.cjs
          node --check admin-ea-indicator-ultra-v371.js
          node --test tests/indicator-admin-ui.test.cjs
          node --check admin-ea-indicator-enterprise-v374.js
          node --test tests/indicator-admin-enterprise.test.cjs
          node --check admin-ea-indicator-compact-v375.js
          node --test tests/indicator-admin-compact.test.cjs
          node --check admin-eai-staff-access-v498.js
          node --check mentor-staff-review-v498.js
          node --check mentor-staff-review-v503.js
          node --test tests/indicator-mentor-access-v498.test.cjs
      - name: Verify team referral course signup and enrollment routing
        run: node tests/team-referral-enrollment.test.mjs
      - name: Verify three distinct installable portals and independent logins
        run: node --test tests/portal-pwa-install.test.cjs
      - name: Verify Mentor native-style mobile app UI without desktop regression
        run: node --test tests/mentor-mobile-app-ui.test.cjs
      - name: Verify OneSignal subscription behavior
        run: node tests/notification-subscription-state.mjs
      - name: Verify EA & Indicator marketplace JavaScript and P+ eligibility
        run: |
          node --check ea-indicator-user-v215.js
          node -e "const fs=require('fs');const s=fs.readFileSync('ea-indicator-user-v215.js','utf8');const page=fs.readFileSync('tradingtools/index.html','utf8');if(!s.includes('min_deposit_usd')||!s.includes('depositAmount<minimumDeposit')||!page.includes('id=\"p-plus-indicator\"'))process.exit(1)"
      - name: Verify User Signal History date filters and total pips
        run: |
          node --check user-signals-core-v29.js
          node tests/signal-history-calendar.test.mjs
      - name: Verify Performance filters, pips and Win Rate
        run: |
          node --check user-signals-core-v29.js
          node tests/performance-calendar.test.mjs
          node tests/performance-render.test.mjs

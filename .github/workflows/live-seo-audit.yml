name: PipSePaisa Live SEO and PageSpeed Audit

on:
  push:
    branches: [main]
    paths:
      - 'scripts/live-seo-audit.mjs'
      - '.github/workflows/live-seo-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipsepaisa-live-seo
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout audited version
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify checker syntax
        run: node --check scripts/live-seo-audit.mjs
      - name: Check deployed public SEO pages and PageSpeed
        run: node scripts/live-seo-audit.mjs
      - name: Lighthouse lab performance (independent of PageSpeed API quota)
        continue-on-error: true
        shell: bash
        run: |
          set -u
          echo "Independent Chrome Lighthouse lab metrics (not Google CrUX field data)"
          success_count=0
          for entry in "home-mobile|https://www.pipsepaisa.com/|mobile" "home-desktop|https://www.pipsepaisa.com/|desktop" "vsa-mobile|https://www.pipsepaisa.com/courses/vsa-volume-spread-analysis/|mobile"; do
            IFS='|' read -r name target device <<< "$entry"
            options=""
            if [ "$device" = "desktop" ]; then options="--preset=desktop"; fi
            echo "=== LIGHTHOUSE $name ==="
            if npm exec --yes --package=lighthouse@12.8.2 -- lighthouse "$target" --only-categories=performance --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output-path="/tmp/$name.json" --quiet $options; then
              node -e '
                const fs=require("node:fs");
                const report=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
                const a=report.audits||{}, m=k=>a[k]?.displayValue||"n/a";
                const score=report.categories?.performance?.score;
                console.log("LAB_REPORT "+process.argv[2]+" score="+(typeof score==="number"?Math.round(score*100):"n/a")
                  +" FCP="+m("first-contentful-paint")
                  +" LCP="+m("largest-contentful-paint")
                  +" TBT="+m("total-blocking-time")
                  +" CLS="+m("cumulative-layout-shift")
                  +" SpeedIndex="+m("speed-index"));
                const opp=Object.values(a).filter(x=>x&&x.details?.type==="opportunity"&&Number.isFinite(x.details.overallSavingsMs)&&x.details.overallSavingsMs>150).sort((x,y)=>y.details.overallSavingsMs-x.details.overallSavingsMs).slice(0,5);
                opp.forEach(x=>console.log("LAB_OPPORTUNITY "+process.argv[2]+" "+x.id+" potentialMs="+Math.round(x.details.overallSavingsMs)));
                if(process.argv[2]==="home-mobile"){
                  const keys=Object.keys(a).filter(k=>/layout|shift|cls|render-blocking|font-display|unsized-images|lcp-discovery|forced-reflow/.test(k));
                  console.log("LAB_CLS_DIAGNOSTIC_KEYS "+keys.join(","));
                  for(const key of keys){
                    const entry=a[key];
                    const items=entry?.details?.items;
                    if(Array.isArray(items)&&items.length){
                      console.log("LAB_CLS_DIAGNOSTIC "+key+" "+JSON.stringify(items.slice(0,6)).slice(0,6500));
                    }else if(entry?.displayValue||entry?.description){
                      console.log("LAB_CLS_NOTE "+key+" "+(entry.displayValue||entry.description).slice(0,220));
                    }
                  }
                }
              ' "/tmp/$name.json" "$name"
              success_count=$((success_count+1))
            else
              echo "LAB_UNAVAILABLE $name Lighthouse could not complete"
            fi
          done
          echo "Lighthouse lab reports completed: $success_count / 3"
          if [ "$success_count" -eq 0 ]; then exit 1; fi

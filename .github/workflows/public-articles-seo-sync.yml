name: PipSePaisa Public Articles SEO Sync

on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate-public-articles.mjs'
      - '.github/workflows/public-articles-seo-sync.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-articles-seo-sync
  cancel-in-progress: false

jobs:
  build-public-articles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Generate crawlable public articles and sitemap
        run: node scripts/generate-public-articles.mjs
      - name: Commit changed public article pages
        run: |
          git add -A articles/read sitemap.xml
          if git diff --cached --quiet; then
            echo "Public article HTML and sitemap already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "SEO: sync public article HTML and sitemap"
          git push origin HEAD:main

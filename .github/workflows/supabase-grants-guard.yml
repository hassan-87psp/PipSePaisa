name: PipSePaisa Supabase New Table Permissions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/sql/**/*.sql'
      - 'supabase/migrations/**/*.sql'
      - 'scripts/check-new-table-grants.mjs'
      - '.github/workflows/supabase-grants-guard.yml'
  pull_request:
    paths:
      - 'supabase/sql/**/*.sql'
      - 'supabase/migrations/**/*.sql'
      - 'scripts/check-new-table-grants.mjs'
      - '.github/workflows/supabase-grants-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-new-table-grants:
    name: Check future Supabase GRANTs and RLS
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout complete comparison history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify script and migration security examples
        run: |
          node --check scripts/check-new-table-grants.mjs
          node scripts/check-new-table-grants.mjs --self-test
      - name: Check only newly introduced public-schema tables
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            base="$BEFORE_SHA"
          else
            base="$(git rev-parse HEAD^)"
          fi
          echo "Auditing new CREATE TABLE statements against Git base $base"
          BASE_SHA="$base" node scripts/check-new-table-grants.mjs

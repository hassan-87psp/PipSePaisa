name: Enforce GitHub Pages HTTPS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enforce-https.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enable HTTPS enforcement for GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body             -X PUT             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GH_REPO/pages"             -d '{"https_enforced":true}')
          echo "$response" | python -c "import json,sys; d=json.load(sys.stdin); print('HTTPS enforced:', d.get('https_enforced'))"

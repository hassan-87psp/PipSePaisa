<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PipSePaisa</title>
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://www.pipsepaisa.com/">
<meta http-equiv="refresh" content="0;url=/">
<script>
(function(){
  var u=new URL(location.href);
  var route=(u.searchParams.get('psp_route')||'').replace(/\/+$/,'');
  var auth=(u.searchParams.get('psp_auth')||'').toLowerCase();
  var map={
    '/sign-in':'/sign-in/',
    '/sign-up':'/sign-up/',
    '/free-course':'/free-course/',
    '/courses':'/courses/',
    '/broker-reviews':'/broker-reviews/',
    '/partner':'/becomepartner/',
    '/become-partner':'/becomepartner/',
    '/trading-tools':'/tradingtools/',
    '/tools-services':'/tradingtools/',
    '/technical':'/technical/',
    '/fundamental':'/fundamental/'
  };
  var dest=map[route]||(auth==='login'?'/sign-in/':auth==='signup'?'/sign-up/':'/');
  u.searchParams.delete('psp_route');
  u.searchParams.delete('psp_auth');
  var q=u.searchParams.toString();
  location.replace(dest+(q?'?'+q:'')+(u.hash||''));
})();
</script>
</head>
<body><p>Redirecting to <a href="/">PipSePaisa</a>…</p></body>
</html>
